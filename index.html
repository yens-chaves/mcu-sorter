<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#101118" />
  <meta name="description" content="Un sorter de películas, series, animación y especiales de Marvel. Enfrenta proyectos, decide tus favoritos y descubre tu ranking y tier list." />
  <title>MCU Sorter — Un universo de opiniones</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%23e74b45%22%2F%3E%3Cpath%20d%3D%22M11%2045V19h8l13%2015%2013-15h8v26h-9V32L32%2045%2020%2032v13z%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E%0A" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  
  
</head>
<body data-theme="avengers">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar wrap">
    <button class="wordmark" id="homeButton" aria-label="Volver al inicio">
      <span class="wordmark-icon"><span>M</span></span>
      <span>MCU<span class="wordmark-soft">SORTER</span></span>
      <span class="wordmark-beta">BETA 02</span>
    </button>
    <div class="top-actions">
      <div class="theme-select" aria-label="Seleccionar tema de color">
        <span class="theme-label" data-i18n="theme">TEMA</span>
        <button title="Avengers" data-pick-theme="avengers" class="theme-dot active" aria-label="Avengers"></button>
        <button title="X-Men '97" data-pick-theme="xmen" class="theme-dot" aria-label="X-Men '97"></button>
        <button title="Fantastic Four" data-pick-theme="f4" class="theme-dot" aria-label="Fantastic Four"></button>
        <button title="Wakanda" data-pick-theme="wakanda" class="theme-dot" aria-label="Wakanda"></button>
        <button title="Guardians of the Galaxy" data-pick-theme="gotg" class="theme-dot" aria-label="Guardians"></button>
      </div>
      <span class="header-line"></span>
      <button class="language-btn" id="langButton" aria-label="Change language">ES <span>⌄</span></button>
    </div>
  </header>
  <main id="main" class="wrap" aria-live="polite"></main>
  <footer class="site-footer wrap">
    <span>MCU SORTER <span class="footer-muted">· Un proyecto fan no oficial · Sin fines de lucro</span></span>
    <span class="footer-muted">Hecho con HTML, CSS y JavaScript</span>
  </footer>
  <div class="toast" id="toast" role="status"></div>
<script defer src="js/catalog.js?v=2"></script>
<script defer src="js/app.js?v=2"></script>
</body>
</html>
